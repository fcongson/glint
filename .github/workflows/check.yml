name: Check

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode
        run: |
          newest=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$newest"
          xcodebuild -version

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Create a simulator
        run: |
          runtime=$(xcrun simctl list runtimes available -j | python3 -c "import json,sys; print([r['identifier'] for r in json.load(sys.stdin)['runtimes'] if r['platform']=='iOS'][-1])")
          udid=$(xcrun simctl create ci-iphone "iPhone 16" "$runtime")
          echo "GLINT_TEST_DESTINATION=id=$udid" >> "$GITHUB_ENV"

      - name: Check
        run: tools/check
