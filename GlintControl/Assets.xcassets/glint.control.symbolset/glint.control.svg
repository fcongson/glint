<?xml version="1.0" encoding="UTF-8"?>
<!--Custom symbol for the Glint control, redrawn from the app icon (docs/app-icon.png). Template version 3.0. A control
    can only draw SF Symbols and custom symbols, not bitmap images, and a symbol is one colour, so the icon's colours
    become shape: dark parts are filled (the ring and the disc) and light parts are cut out (the hexagon outline and
    the two dots). One weight (Regular) at the three sizes, all the same shape. Drawn 1.5x the size of a plain
    circle symbol, so it fills its button like the others. -->
