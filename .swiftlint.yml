baseline: .swiftlint-baseline.json

included:
  - Glint
  - GlintCapture
  - GlintControl
  - Shared
  - GlintTests
  - GlintUITests

# Formatting is swift-format's job (see .swift-format); SwiftLint only checks correctness and hygiene.
disabled_rules:
  - line_length
  - trailing_comma
  - opening_brace
  - vertical_whitespace
  - todo # replaced by the stricter custom rule below
  - closure_parameter_position # swift-format decides where closure parameters go
  - multiple_closures_with_trailing_closure
  - static_over_final_class # UIKit's layerClass has to be a class property
  - discouraged_optional_boolean # nil means "never saved" in SavedSettings

opt_in_rules:
  - closure_end_indentation
  - collection_alignment
  - contains_over_filter_count
  - contains_over_first_not_nil
  - empty_count
  - empty_string
  - explicit_init
  - first_where
  - flatmap_over_map_reduce
  - force_unwrapping
  - implicit_return
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - lower_acl_than_parent
  - modifier_order
  - overridden_super_call
  - prohibited_super_call
  - reduce_into
  - redundant_nil_coalescing
  - sorted_first_last
  - static_operator
  - unavailable_function
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call

analyzer_rules:
  - unused_declaration
  - unused_import

force_unwrapping:
  severity: error

custom_rules:
  no_todo_comments:
    name: "TODO/FIXME comment"
    regex: '//\s*(TODO|FIXME|HACK|XXX)\b'
    message: "Fix it now, or write it up as an issue. Don't leave a note in the code."
    severity: error
  no_commented_out_code:
    name: "Commented-out code"
    regex: '^[ \t]*//[ \t]*(let|var|func|if|guard|for|while|return|try|await|import|struct|class|enum|case)[ \t][^\n]*[{};)][ \t]*$'
    message: "Delete it; git remembers."
    severity: error

# The image and exposure maths uses conventional short names (x, y, w, h, ev).
identifier_name:
  min_length: 1
  excluded: [id]

type_name:
  min_length: 2
